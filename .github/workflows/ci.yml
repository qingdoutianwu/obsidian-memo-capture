name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m py_compile plugin/__init__.py skill/scripts/capture_memo.py tests/test_all.py tests/test_capture_memo.py tests/test_plugin_helpers.py
      - name: Run tests
        run: python tests/test_all.py
      - name: Install manifest validator
        run: python -m pip install --disable-pip-version-check --no-input 'PyYAML>=6,<7'
      - name: Validate plugin manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path('plugin/plugin.yaml').read_text())
          assert data['name'] == 'obsidian-memo-capture'
          assert 'pre_gateway_dispatch' in data['provides_hooks']
          print('manifest: PASS')
          PY
